# What publishes, and where.
#
# Everything under publish_dir is synced 1:1 to write_prefix. Data files are
# never placed under publish_dir, so they cannot be published by accident.
#
# Source Cooperative serves these objects. data.source.coop returns raw bytes.
# source.coop renders the human-facing page.

# The S3 URI uploads are written to: the real bucket behind Source Cooperative,
# as the other portolan-mirrors catalogs use. CI writes through the IAM role
# Source Cooperative approved for the portolan-mirrors organization.
write_prefix: s3://us-west-2.opendata.source.coop/portolan-mirrors/gem-15-catalog

# The public base URL that serves write_prefix. Every href in the catalog is
# built from this, so it goes in the STAC JSON and write_prefix does not.
public_base: https://data.source.coop/portolan-mirrors/gem-15-catalog

region: us-west-2

# No endpoint_url: write_prefix names the bucket in AWS S3 directly.
#
# Publishing by hand instead, with your own Source Cooperative login, goes
# through the data.source.coop gateway, where the account is the bucket. Use
# these values for that run (and do not commit them):
#   write_prefix: s3://portolan-mirrors/gem-15-catalog
#   endpoint_url: https://data.source.coop
#   profile: source-coop      # credential_process = source-coop creds

# The named AWS profile for a local run with the organization role. CI leaves
# it unused: configure-aws-credentials puts the role in the environment, and
# publish.py prefers that whenever AWS_ACCESS_KEY_ID is set.
profile: portolan-mirrors

# The directory that IS the published catalog, synced 1:1 to write_prefix.
# Nothing outside it is ever uploaded.
publish_dir: catalog

# The staging directory that holds generated files too large or too numerous
# for git, read by tools/upload_data.py: the generated item tree (13,485 item
# JSONs plus the 10-degree group catalogs with their README/AGENTS files),
# items.parquet, the overview COG, the terrarium terrain PMTiles, and
# thumbnails. It mirrors the catalog layout, so staging/publish/gem-15/x lands
# at gem-15/x in the bucket. The GEM-15 COGs themselves are never staged: this
# catalog references them at Google's bucket.
data_dir: staging/publish
